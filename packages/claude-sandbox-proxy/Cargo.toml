[package]
name = "claude-sandbox-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "error-context", "std"] }
fast-socks5 = "1"
log = "0.4"
systemd-journal-logger = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "time"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
