workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

stages:
  - update
  - check
  - propose

variables:
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"

update-inputs:
  stage: update
  tags:
    - nix-x86_64-linux
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - nix flake update
  artifacts:
    paths:
      - flake.lock
    expire_in: 1 day

check:
  stage: check
  timeout: 1h
  needs:
    - job: update-inputs
      optional: true
  parallel:
    matrix:
      - ARCH: [x86_64, aarch64]
  tags:
    - nix-${ARCH}-linux
  script:
    - nix flake check

propose-update:
  stage: propose
  tags:
    - nix-x86_64-linux
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  needs:
    - update-inputs
    - check
  script:
    - git add flake.lock
    - 'git diff --cached --quiet && echo "no input updates" && exit 0 || true'
    - 'git -c user.name="$GITLAB_USER_NAME" -c user.email="$GITLAB_USER_EMAIL" commit -m "flake: update inputs"'
    - git remote set-url origin "https://gitlab-ci-token:$CI_JOB_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git"
    - 'git push -f origin HEAD:refs/heads/chore/flake-update -o merge_request.create -o merge_request.target="$CI_DEFAULT_BRANCH" -o merge_request.title="flake: update inputs" -o merge_request.remove_source_branch'
